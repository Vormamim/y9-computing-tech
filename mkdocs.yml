site_name: 9 Computing Technology
site_description: Year 9 Computing Technology - Gosford High School
docs_dir: docs
use_directory_urls: false   # keeps relative paths in raw HTML (figures, video) valid

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.code.annotate
  # Vormamim house style: dark only, colours set in assets/house-style.css
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: IBM Plex Mono
    code: IBM Plex Mono
  logo: assets/logo.svg
  favicon: assets/logo.svg

extra_css:
  - https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap
  - assets/extra.css
  - assets/house-style.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

